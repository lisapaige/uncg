fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-ast
  # A saved notebook carries every chart, dataframe, and printed row into the diff,
  # and with a live run that includes response text and judge reasoning. Stripped,
  # so review reads the code.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # The cells carry hand-written ids so a script can address them; without
        # --keep-id every run renumbers them.
        args: [--keep-id]
  # ruff runs from the project venv, so the hook and the CLI share the one version
  # pinned in pyproject.toml instead of drifting apart silently.
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/kraymer/brack
    rev: v1.0.0
    hooks:
      - id: brack
        args:
          [
            "-r",
            '^(main|(adr|bugfix|chore|ci|docs|exp|feature|hotfix|improvement|library|pdr|prerelease|refactor|rfc|test)\/[a-z0-9._-]+|release\/[0-9][0-9]\.[0-9][0-9]\.[0-9][0-9](\.[0-9]+)?)$',
          ]
  - repo: local
    hooks:
      - id: pyright
        name: pyright type checker
        entry: uv run pyright
        language: system
        types: [python]
        exclude: test
  - repo: local
    hooks:
      - id: vulture-deadcode
        name: Vulture dead code check (non-blocking, staged files only)
        entry: bash -c 'uv run vulture "$@" || true' --
        language: system
        types: [python]
        pass_filenames: true
        always_run: false
        verbose: true

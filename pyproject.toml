[project]
name = "uncg"
version = "0.1.0"
description = "UNCG instance data: crawl configs (whitelist SSOT), crawl and chunk snapshots, eval data."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncg"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "ruff",
    "vulture>=2.15",
]
